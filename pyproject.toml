[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolab"
version = "0.3.0"
license = "Apache-2.0"
description = "Autonomous Research Lab: controller-owned research + engineering loop with ChatGPT (scientist), Claude (engineer) and Codex (verifier) agents"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autolab = "autolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
