[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX license string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "autolab"
version = "0.9.0"
license = "Apache-2.0"
description = "Autonomous Research & Engineering Lab: controller-owned research and engineering loop with replaceable agents on any model provider"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autolab = "autolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autolab = ["web/*.html", "web/*.js", "web/*.css", "presets/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
